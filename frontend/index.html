<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#166534" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GramSaathi" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- SEO -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="GramSaathi AI — AI-powered assistance for rural citizens: farmers, students, and villagers across India." />
    <meta name="keywords" content="GramSaathi, AI, rural India, farmers, government schemes, crop disease, agriculture, weather alerts" />
    <meta property="og:title" content="GramSaathi AI" />
    <meta property="og:description" content="AI-powered assistant for rural citizens of India — crop doctor, weather alerts, government schemes in your language." />
    <meta property="og:type" content="website" />
    <title>GramSaathi AI — Your Rural AI Assistant</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[SW] Registered:', reg.scope))
            .catch(err => console.log('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
