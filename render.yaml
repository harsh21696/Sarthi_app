# render.yaml — Render Blueprint for GramSaathi AI
# Deploys: Backend (Web Service) + Frontend (Static Site) + PostgreSQL

services:
  # ─── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: gramsaathi-backend
    runtime: node
    region: singapore          # Closest to India
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: gramsaathi-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false            # Set manually in Render dashboard after frontend deploys
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 5242880

  # ─── Frontend Static Site ────────────────────────────────────────────────────
  - type: web
    name: gramsaathi-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false            # Set to your backend URL: https://gramsaathi-backend.onrender.com/api

# ─── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: gramsaathi-db
    region: singapore
    plan: free
    databaseName: gramsaathi_db
    user: gramsaathi
